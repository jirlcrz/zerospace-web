<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set New Password — ZeroSpace Web</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-void: #0A0E1A; --bg-panel: #121829; --bg-panel-raised: #171F36;
  --accent: #5B6EF5; --accent-dim: #3C4A9E; --star: #F5C77E;
  --text: #E8EAF2; --text-dim: #8890A8; --border: #242C47;
  --danger: #F2715B; --success: #6FCF97;
  --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
  --radius-sm: 6px; --radius-md: 10px;
}
@media (prefers-reduced-motion: reduce) {
  * { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg-void); color: var(--text); font-family: var(--font-body); -webkit-font-smoothing: antialiased; }
a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
#starfield { position: fixed; inset: 0; z-index: 0; background: var(--bg-void); }
.app-shell { position: relative; z-index: 1; min-height: 100vh; display: flex; flex-direction: column; }
.auth-wrap { flex: 1; display: flex; align-items: center; justify-content: center; padding: 24px 16px; }
.auth-card { width: 100%; max-width: 400px; background: var(--bg-panel); border: 1px solid var(--border); border-radius: var(--radius-md); padding: 32px 28px; }
.brand { display: flex; align-items: center; gap: 10px; margin-bottom: 28px; justify-content: center; }
.brand-mark { width: 28px; height: 28px; flex-shrink: 0; }
.brand-name { font-family: var(--font-display); font-size: 20px; font-weight: 600; letter-spacing: 0.01em; }
.auth-card h1 { font-family: var(--font-display); font-size: 22px; font-weight: 500; text-align: center; margin-bottom: 6px; }
.auth-sub { text-align: center; color: var(--text-dim); font-size: 14px; margin-bottom: 24px; }
.field { margin-bottom: 16px; }
.field label { display: block; font-size: 13px; color: var(--text-dim); margin-bottom: 6px; }
.field input { width: 100%; background: var(--bg-void); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px 13px; color: var(--text); font-size: 15px; font-family: var(--font-body); transition: border-color 0.15s ease; }
.field input:focus { border-color: var(--accent); }
.hint { font-size: 12px; color: var(--text-dim); margin-top: 6px; }
.btn-primary { width: 100%; background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm); padding: 12px; font-size: 15px; font-weight: 600; margin-top: 4px; transition: background 0.15s ease; }
.btn-primary:hover { background: #6B7BFF; }
.btn-primary:disabled { background: var(--accent-dim); cursor: not-allowed; }
.btn-google { width: 100%; background: var(--bg-panel-raised); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 11px; font-size: 14.5px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 12px; transition: border-color 0.15s ease; }
.btn-google:hover { border-color: var(--text-dim); }
.divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-dim); font-size: 12px; }
.divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
.auth-links { margin-top: 22px; display: flex; flex-direction: column; gap: 10px; align-items: center; }
.auth-links a { font-size: 13.5px; color: var(--text-dim); transition: color 0.15s ease; }
.auth-links a:hover { color: var(--accent); }
.auth-links .primary-link { color: var(--accent); font-weight: 500; }
.form-status { font-size: 13.5px; text-align: center; padding: 10px; border-radius: var(--radius-sm); margin-top: 16px; display: none; }
.form-status.show { display: block; }
.form-status.error { background: rgba(242, 113, 91, 0.12); color: var(--danger); }
.form-status.success { background: rgba(111, 207, 151, 0.12); color: var(--success); }
.footer-links { padding: 20px 16px 28px; display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 4px; font-size: 12.5px; color: var(--text-dim); }
.footer-links a { padding: 4px 8px; transition: color 0.15s ease; }
.footer-links a:hover { color: var(--text); }
.footer-dot { color: var(--border); padding-top: 4px; }
@media (min-width: 900px) {
  .app-shell { flex-direction: row; height: 100vh; overflow: hidden; }
  .auth-wrap { flex: 0 0 420px; background: var(--bg-panel); border-right: 1px solid var(--border); align-items: flex-start; padding-top: 56px; overflow-y: auto; height: 100vh; }
  .auth-card { border: none; background: transparent; padding: 0 40px; max-width: none; }
  .brand { justify-content: flex-start; }
  .auth-card h1 { text-align: left; }
  .auth-sub { text-align: left; }
  .footer-links { flex: 0 0 420px; }
  .content-panel { flex: 1; overflow-y: auto; height: 100vh; display: block; }
  .main-col { flex-direction: column; }
  .left-col-wrap { display: flex; flex-direction: column; flex: 0 0 420px; height: 100vh; }
  .left-col-wrap .auth-wrap { flex: 1; }
  .left-col-wrap .footer-links { flex: none; }
}
@media (max-width: 899.98px) { .content-panel { display: none; } }
.content-hero { padding: 72px 64px 48px; max-width: 640px; }
.content-hero .eyebrow-rocket { width: 44px; height: 44px; margin-bottom: 24px; }
.content-hero h2 { font-family: var(--font-display); font-size: 40px; font-weight: 500; line-height: 1.15; margin-bottom: 18px; }
.content-hero p { font-size: 16px; line-height: 1.6; color: var(--text-dim); margin-bottom: 14px; }
.feature-list { padding: 0 64px 72px; max-width: 640px; display: flex; flex-direction: column; gap: 28px; }
.feature-row { display: flex; gap: 18px; align-items: flex-start; }
.feature-icon { width: 36px; height: 36px; flex-shrink: 0; border-radius: var(--radius-sm); background: var(--bg-panel); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
.feature-icon svg { width: 18px; height: 18px; stroke: var(--star); }
.feature-copy h3 { font-family: var(--font-display); font-size: 16px; font-weight: 500; margin-bottom: 4px; }
.feature-copy p { font-size: 14px; color: var(--text-dim); line-height: 1.5; }

</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="app-shell">
  <div class="auth-wrap">
    <div class="auth-card">

      <div class="brand">
        <svg class="brand-mark" viewBox="0 0 28 28" fill="none">
          <path d="M14 2 L18 14 L14 26 L10 14 Z" fill="#5B6EF5"/>
          <circle cx="14" cy="11" r="2.4" fill="#0A0E1A"/>
        </svg>
        <span class="brand-name">ZeroSpace</span>
      </div>

      <h1>Set a new password</h1>
      <p class="auth-sub">Choose something you haven't used before.</p>

      <form id="reset-form" novalidate>
        <div class="field">
          <label for="password">New password</label>
          <input type="password" id="password" name="password" autocomplete="new-password" required>
          <div class="hint">At least 8 characters.</div>
        </div>
        <div class="field">
          <label for="confirm-password">Confirm new password</label>
          <input type="password" id="confirm-password" name="confirm-password" autocomplete="new-password" required>
        </div>
        <button type="submit" class="btn-primary" id="submit-btn">Update Password</button>
      </form>

      <div id="form-status" class="form-status"></div>

      <div class="auth-links">
        <a href="index.html" class="primary-link">Back to Sign In</a>
      </div>

    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script>
// ========================================
// ↓↓↓ PASTE YOUR SUPABASE KEYS HERE ↓↓↓
// ========================================
const SUPABASE_URL = 'https://hgrgznwnyfgwdomcndfk.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_e5ikaG_KsErjvynRW5le_w_qOKs8JYB';
// ========================================
// ↑↑↑ EDIT ONLY THE TWO LINES ABOVE ↑↑↑
// ========================================

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

(function () {
  const canvas = document.getElementById('starfield');
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const prefersReducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  let w, h, dpr, stars = [], rocket = { t: -0.3 };

  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    buildStars();
  }
  function buildStars() {
    const count = Math.floor((w * h) / 9000);
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.3 + 0.2, tw: Math.random() * Math.PI * 2, speed: Math.random() * 0.015 + 0.005 });
    }
  }
  function drawStars(time) {
    ctx.fillStyle = '#0A0E1A'; ctx.fillRect(0, 0, w, h);
    for (const s of stars) {
      const flicker = prefersReducedMotion ? 1 : (Math.sin(time * s.speed + s.tw) + 1) / 2;
      const alpha = 0.25 + flicker * 0.55;
      ctx.beginPath(); ctx.fillStyle = `rgba(232, 234, 242, ${alpha.toFixed(2)})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
  }
  function drawRocket() {
    if (prefersReducedMotion) return;
    rocket.t += 0.0009;
    if (rocket.t > 1.3) rocket.t = -0.3;
    const t = Math.max(0, Math.min(1, rocket.t));
    if (rocket.t < 0 || rocket.t > 1) return;
    const startX = -60, startY = h * 0.85, endX = w + 60, endY = h * 0.08, ctrlX = w * 0.5, ctrlY = h * 0.15;
    const x = (1 - t) * (1 - t) * startX + 2 * (1 - t) * t * ctrlX + t * t * endX;
    const y = (1 - t) * (1 - t) * startY + 2 * (1 - t) * t * ctrlY + t * t * endY;
    const dx = 2 * (1 - t) * (ctrlX - startX) + 2 * t * (endX - ctrlX);
    const dy = 2 * (1 - t) * (ctrlY - startY) + 2 * t * (endY - ctrlY);
    const angle = Math.atan2(dy, dx);
    const trailLen = 70;
    ctx.save();
    const grad = ctx.createLinearGradient(x - Math.cos(angle) * trailLen, y - Math.sin(angle) * trailLen, x, y);
    grad.addColorStop(0, 'rgba(91, 110, 245, 0)'); grad.addColorStop(1, 'rgba(245, 199, 126, 0.65)');
    ctx.strokeStyle = grad; ctx.lineWidth = 2;
    ctx.beginPath(); ctx.moveTo(x - Math.cos(angle) * trailLen, y - Math.sin(angle) * trailLen); ctx.lineTo(x, y); ctx.stroke();
    ctx.translate(x, y); ctx.rotate(angle);
    ctx.fillStyle = '#E8EAF2'; ctx.beginPath();
    ctx.moveTo(8, 0); ctx.lineTo(-6, -3.5); ctx.lineTo(-3, 0); ctx.lineTo(-6, 3.5); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#5B6EF5'; ctx.beginPath(); ctx.arc(2, 0, 1.6, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
  function frame(time) { drawStars(time * 0.001); drawRocket(); requestAnimationFrame(frame); }
  window.addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
})();


(function () {
  const form = document.getElementById('reset-form');
  const passwordInput = document.getElementById('password');
  const confirmInput = document.getElementById('confirm-password');
  const statusBox = document.getElementById('form-status');
  const submitBtn = document.getElementById('submit-btn');

  function showStatus(message, type) { statusBox.textContent = message; statusBox.className = 'form-status show ' + type; }

  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    const password = passwordInput.value;
    const confirm = confirmInput.value;
    if (password.length < 8) { showStatus('Password needs at least 8 characters.', 'error'); return; }
    if (password !== confirm) { showStatus('Passwords don\u2019t match.', 'error'); return; }

    submitBtn.disabled = true; submitBtn.textContent = 'Updating…';
    const { error } = await supabaseClient.auth.updateUser({ password });
    submitBtn.disabled = false; submitBtn.textContent = 'Update Password';

    if (error) { showStatus(error.message, 'error'); return; }
    showStatus('Password updated. Redirecting to sign in…', 'success');
    setTimeout(() => { window.location.href = 'index.html'; }, 1800);
  });
})();
</script>
</body>
</html>
