<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading — ZeroSpace Web</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg-void: #0A0E1A; --bg-panel: #121829;
  --accent: #5B6EF5; --star: #F5C77E;
  --text: #E8EAF2; --text-dim: #8890A8;
  --font-display: 'Space Grotesk', sans-serif; --font-body: 'Inter', sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; background: var(--bg-void); color: var(--text); font-family: var(--font-body); overflow: hidden; }
#starfield { position: fixed; inset: 0; z-index: 0; }

.loading-wrap {
  position: relative; z-index: 1;
  min-height: 100vh; display: flex; flex-direction: column;
  align-items: center; justify-content: center; padding: 24px; text-align: center;
}

.logo-bounce {
  width: 64px; height: 64px; margin-bottom: 28px;
  animation: bounce 1.1s ease-in-out infinite;
}
@keyframes bounce {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-18px); }
}
@media (prefers-reduced-motion: reduce) {
  .logo-bounce { animation: none; }
}

.brand-name {
  font-family: var(--font-display); font-size: 20px; font-weight: 600;
  margin-bottom: 36px; letter-spacing: 0.01em;
}

.fact-box {
  max-width: 380px; min-height: 60px;
  display: flex; align-items: center; justify-content: center;
}
.fact-label {
  font-size: 11px; text-transform: uppercase; letter-spacing: 0.08em;
  color: var(--star); margin-bottom: 8px; display: block;
}
.fact-text {
  font-size: 14.5px; line-height: 1.55; color: var(--text-dim);
  opacity: 0; transition: opacity 0.4s ease;
}
.fact-text.show { opacity: 1; }

.loading-dots { display: flex; gap: 6px; margin-top: 32px; }
.loading-dots span {
  width: 6px; height: 6px; border-radius: 50%; background: var(--accent);
  animation: pulse 1.2s ease-in-out infinite;
}
.loading-dots span:nth-child(2) { animation-delay: 0.15s; }
.loading-dots span:nth-child(3) { animation-delay: 0.3s; }
@keyframes pulse {
  0%, 100% { opacity: 0.25; transform: scale(0.8); }
  50% { opacity: 1; transform: scale(1); }
}
</style>
</head>
<body>

<canvas id="starfield"></canvas>

<div class="loading-wrap">
  <svg class="logo-bounce" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
    <path d="M14 1.5C14 1.5 20 7 20 15C20 19 18 22.5 14 25C10 22.5 8 19 8 15C8 7 14 1.5 14 1.5Z" fill="#5B6EF5"/>
    <path d="M8 18L4 22L6 24L8.5 20.5" fill="#F5C77E"/>
    <path d="M20 18L24 22L22 24L19.5 20.5" fill="#F5C77E"/>
    <ellipse cx="14" cy="11.5" rx="3.6" ry="4.4" fill="none" stroke="#0A0E1A" stroke-width="2.6"/>
  </svg>

  <div class="brand-name">ZeroSpace</div>

  <div class="fact-box">
    <div>
      <span class="fact-label">Did you know?</span>
      <div class="fact-text show" id="fact-text">Loading…</div>
    </div>
  </div>

  <div class="loading-dots"><span></span><span></span><span></span></div>
</div>

<script>
const facts = [
  "A day on Venus is longer than its year — it takes 243 Earth days to rotate once, but only 225 to orbit the sun.",
  "There are more stars in the universe than grains of sand on every beach on Earth.",
  "The Great Red Spot on Jupiter is a storm that's been raging for at least 350 years.",
  "Neutron stars are so dense that a sugar-cube-sized piece would weigh about a billion tons.",
  "Space is completely silent — there's no air for sound waves to travel through.",
  "The footprints on the Moon will likely stay there for millions of years since there's no wind to erode them.",
  "One million Earths could fit inside the Sun.",
  "The International Space Station travels at about 17,500 mph, circling Earth every 90 minutes.",
  "Saturn is so light that it would float in a bathtub large enough to hold it.",
  "A full NASA space suit costs around $12 million, but most of that is the backpack and control module.",
  "The coldest known spot in the universe is the Boomerang Nebula, at about -458°F.",
  "Light from the Sun takes about 8 minutes and 20 seconds to reach Earth.",
  "There's a planet made largely of diamond, known as 55 Cancri e.",
  "Olympus Mons on Mars is the largest volcano in the solar system — nearly 3x the height of Everest.",
  "Astronauts can grow up to 2 inches taller in space due to the lack of gravity compressing their spine."
];

const factEl = document.getElementById('fact-text');
let factIndex = Math.floor(Math.random() * facts.length);
factEl.textContent = facts[factIndex];

function cycleFact() {
  factEl.classList.remove('show');
  setTimeout(() => {
    factIndex = (factIndex + 1) % facts.length;
    factEl.textContent = facts[factIndex];
    factEl.classList.add('show');
  }, 400);
}
setInterval(cycleFact, 2800);

// ---- Starfield (lightweight, no rocket streak needed here) ----
(function () {
  const canvas = document.getElementById('starfield');
  const ctx = canvas.getContext('2d');
  let w, h, dpr, stars = [];
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = w * dpr; canvas.height = h * dpr;
    canvas.style.width = w + 'px'; canvas.style.height = h + 'px';
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const count = Math.floor((w * h) / 9000);
    stars = [];
    for (let i = 0; i < count; i++) {
      stars.push({ x: Math.random() * w, y: Math.random() * h, r: Math.random() * 1.3 + 0.2, tw: Math.random() * Math.PI * 2, speed: Math.random() * 0.015 + 0.005 });
    }
  }
  function frame(time) {
    ctx.fillStyle = '#0A0E1A'; ctx.fillRect(0, 0, w, h);
    for (const s of stars) {
      const flicker = (Math.sin(time * 0.001 * s.speed + s.tw) + 1) / 2;
      ctx.beginPath(); ctx.fillStyle = `rgba(232,234,242,${(0.25 + flicker * 0.55).toFixed(2)})`;
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2); ctx.fill();
    }
    requestAnimationFrame(frame);
  }
  window.addEventListener('resize', resize); resize(); requestAnimationFrame(frame);
})();

// ---- Redirect after a short beat ----
// This page is meant to be shown briefly between auth success and the dashboard.
// It reads a target from the URL (?next=dashboard.html) or defaults to dashboard.html.
const params = new URLSearchParams(window.location.search);
const next = params.get('next') || 'dashboard.html';
setTimeout(() => { window.location.href = next; }, 2200);
</script>
</body>
</html>
